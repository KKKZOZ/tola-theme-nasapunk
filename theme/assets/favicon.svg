<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Orbital mark from the home hero, simplified for 16-32px. -->
  <style>
    .ink { stroke: #222a2d; fill: none; }
    .dot { fill: #222a2d; }
    .ring { stroke: #9aa3a0; fill: none; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f2f2ee; }
      .dot { fill: #f2f2ee; }
      .ring { stroke: #7d8986; }
    }
  </style>
  <circle class="ring" cx="16" cy="16" r="13.5" stroke-width="1.5"/>
  <circle class="ink" cx="16" cy="16" r="6" stroke-width="2.2"/>
  <line x1="3.5" y1="24.75" x2="28.5" y2="7.25" stroke="#cb4b22" stroke-width="3.2" stroke-linecap="round"/>
  <circle class="dot" cx="26" cy="4.6" r="2.6"/>
</svg>
