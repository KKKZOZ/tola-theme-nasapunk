# Tola configuration (v0.8.2)
# https://github.com/tola-rs/tola-ssg
#
# The theme is the module in theme/ (tola-module.toml), selected as
# `nasapunk`. Its settings go under [modules.nasapunk.options] below; the
# defaults, with notes, are in theme/tola-module.toml.

# tola help "[site]"
[site]
# origin = ""  # Public address, e.g. "https://example.com"; needed for feeds and sitemaps
base-path = "/"
title = "NASApunk"
authors = [{ name = "Your Name" }]
description = "A Typst blog theme in the NASApunk style."
language = "en"

# tola help "[build]"
# The theme's site program builds every page. To pass it Typst values
# (extra <head> markup, a comments block under posts), set
# `entry = "site.typ"` and edit site.typ.
[build]
entry = { module = "nasapunk" }
content-dir = "content"
publish-dir = "public"

# tola help "[build.references]"
# A broken link, image or section anchor fails the build. Links to drafts
# are not links until the draft publishes (theme/templates/base.typ
# `site-link`).
[build.references]
navigation = "error"
resources = "error"
fragments = "error"

# tola help "[modules]"
# A copy of this template keeps the theme in theme/. To follow the theme's
# releases instead, delete theme/ and fetch it from Git, then `tola update
# nasapunk` to upgrade:
#   git = { url = "https://github.com/KKKZOZ/tola-theme-nasapunk", branch = "preview", subdir = "theme" }
[modules.nasapunk]
path = "theme"

# Every option, with its default and notes, is in theme/tola-module.toml.
[modules.nasapunk.options]
doc-prefix = "TN"
social-links = [
  { label = "GitHub", url = "https://github.com/KKKZOZ/tola-theme-nasapunk" },
]

# tola help "[typst.fonts]"
# Compiler fonts for SVG frames (math, cetz) and the preview image: IBM Plex
# Mono and Rajdhani ship with the theme (theme/typst-fonts/). System fonts
# stay on for CJK text, which no bundled font covers (`cjk-font` option).
[typst.fonts]
paths = []
modules = ["nasapunk"]
system = true

# tola help "[assets]"
# Your own files, such as post images: "/assets/images/x.png". The theme's
# stylesheets, scripts and web fonts are published by the module.
[assets]
cache-busting = true
trees = [{ source = "assets", url-prefix = "/assets" }]
files = []

# tola help "[server]"
[server]
interface = "127.0.0.1"
port = 5277

# tola help "[dev]"
[dev]
watch = true

# tola help "[vendor]"
[vendor]
path = "vendor"
