# Tola configuration (v0.8.0)
# https://github.com/tola-rs/tola-ssg
#
# Site-specific values without a `[site]` key (doc-number prefix, mission
# code) live in `templates/config.typ`.

# tola help "[site]"
[site]
# origin = ""  # Public address, e.g. "https://example.com"; needed for feeds and sitemaps
base-path = "/"
title = "NASApunk"
authors = [{ name = "Your Name" }]
description = "A Typst blog theme in the NASApunk style."
language = "en"

# tola help "[build]"
[build]
entry = "site.typ"
content-dir = "content"
publish-dir = "public"

# tola help "[build.references]"
# A broken link, image or section anchor fails the build. Links to drafts
# are not links until the draft publishes (templates/base.typ `site-link`).
[build.references]
navigation = "error"
resources = "error"
fragments = "error"

# tola help "[build.hooks]"
# Pagefind indexes the compiled pages for /search/ (scripts/search-index.mjs).
# Skipped by `tola dev` so saves reload without waiting for the index; `tola
# preview` and `tola build` run it. Set `dev = "run"` to search in dev too.
[[build.hooks.generate-outputs]]
enable = true
name = "search"
command = ["node", "scripts/search-index.mjs"]
dev = "skip"
rerun-on = ["scripts/search-index.mjs", "package.json", "package-lock.json"]
outputs = [{ tree = "pagefind" }]

# Lists formulas that cannot copy as LaTeX, compiler style, while `tola dev`
# runs (scripts/math-check.mjs). Tola shows the list as a failed hook, but the
# site still updates. `tola build` skips it, so a deployment is never held up.
[[build.hooks.after-publish]]
enable = true
name = "math-check"
command = ["node", "scripts/math-check.mjs"]
dev = "run"
rerun-on = ["scripts/math-check.mjs"]

# tola help "[typst.fonts]"
# Compiler fonts for SVG frames (math, cetz) and the preview image: IBM Plex
# Mono and Rajdhani ship in typst-fonts/. System fonts stay on for CJK text,
# which no bundled font covers (`cjk-font` in templates/config.typ).
[typst.fonts]
paths = ["typst-fonts"]
system = true

# tola help "[assets]"
[assets]
cache-busting = true
trees = [{ source = "assets", url-prefix = "/assets" }]
files = []

# tola help "[server]"
[server]
interface = "127.0.0.1"
port = 5277

# tola help "[dev]"
[dev]
watch = true

# tola help "[vendor]"
[vendor]
path = "vendor"
