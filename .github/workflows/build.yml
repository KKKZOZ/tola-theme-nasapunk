# Builds the example site with every Tola release the theme supports (the
# compatibility matrix), and with Tola's main branch as an early warning. The
# weekly run catches new Tola releases even when the theme itself has not
# changed: each one joins the matrix on its own.
name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Oldest supported Tola release; keep it in step with the README badges.
  # The search hook downloads Pagefind with Nu's `http get`, which works from
  # the release after 0.8.2-pre.2 on (tola-rs/tola-ssg#107); pre-releases
  # count too. Until one ships, no release qualifies and Tola main is the
  # check.
  MIN_TOLA: 0.8.2-pre.3

jobs:
  versions:
    name: Supported Tola releases
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      # Releases from MIN_TOLA on, newest first, as a JSON array. In the
      # comparison "-" reads as "~", which version sort puts before the
      # release it leads up to: 0.8.2-pre.2 < 0.8.2.
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key() { printf '%s\n' "$1" | tr - '~'; }
          versions=$(
            gh release list --repo tola-rs/tola-ssg --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' \
              | sed 's/^v//' \
              | while read -r v; do
                  [ "$(printf '%s\n%s\n' "$(key "$MIN_TOLA")" "$(key "$v")" | sort -V | head -n1)" = "$(key "$MIN_TOLA")" ] && echo "$v"
                done \
              | tr - '~' | sort -rV | tr '~' - \
              | jq -R -s -c 'split("\n") | map(select(. != ""))'
          )
          echo "Supported releases: $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  release:
    name: Tola ${{ matrix.version }}
    needs: versions
    if: needs.versions.outputs.versions != '[]'
    runs-on: ubuntu-latest
    strategy:
      # Report every release, not only the first one that breaks.
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/install-tola
        with:
          version: ${{ matrix.version }}

      - name: Build
        run: tola build --locked

  main:
    name: Tola main
    needs: versions
    runs-on: ubuntu-latest
    # Upstream main may break between releases; once a release supports the
    # theme, report it without failing the workflow. Until then it is the only
    # build, and it must pass.
    continue-on-error: ${{ needs.versions.outputs.versions != '[]' }}
    env:
      # A quicker release build than Tola's own (thin LTO, one codegen unit);
      # the binary only builds this small site.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v5

      # Outside the site, so the build never sees Tola's sources.
      - name: Clone Tola main
        id: tola
        run: |
          git clone --quiet --depth=1 https://github.com/tola-rs/tola-ssg.git "$RUNNER_TEMP/tola-src"
          echo "sha=$(git -C "$RUNNER_TEMP/tola-src" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The binary for this commit of main, when an earlier run built it.
      - name: Restore Tola build
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tola
          key: tola-main-${{ steps.tola.outputs.sha }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      # Compiled dependencies carry over between commits of main, so a new
      # commit rebuilds mostly Tola's own crates.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/tola-src -> target
          # The Tola binary is cached above, per commit.
          cache-bin: false

      - name: Build Tola from main
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo build --release --locked --bin tola --manifest-path "$RUNNER_TEMP/tola-src/Cargo.toml"
          install -D "$RUNNER_TEMP/tola-src/target/release/tola" ~/.cargo/bin/tola

      - run: tola --version

      - name: Build
        run: tola build

  # theme/tests/latex.typ: the LaTeX copied formulas carry. Typst at the version
  # the newest supported Tola release builds with.
  latex:
    name: LaTeX copy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - run: node theme/tests/test-latex.mjs
